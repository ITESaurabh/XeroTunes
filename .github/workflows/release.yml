name: Release

# Push a semver tag to cut a release. A prerelease tag (contains a hyphen, e.g.
# v0.10.0-beta.1) builds the beta channel and publishes a GitHub prerelease; a
# clean tag (v0.10.0) builds stable and publishes a full release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Tags aren't tied to a branch. Stable releases must come from main, beta
  # prereleases (hyphen tags) from development.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag to be on its channel's branch
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            branch=development
          else
            branch=main
          fi
          git fetch origin "$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::Tag ${{ github.ref_name }} ($GITHUB_SHA) is not on $branch; refusing to release."
            exit 1
          fi

  release:
    needs: guard
    # Selects which set of environment secrets (DISCORD_CLIENT_ID, ...) to use.
    # Beta tags read the "beta" environment, stable tags "production".
    environment: ${{ contains(github.ref_name, '-') && 'beta' || 'production' }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned, not ubuntu-latest: better-sqlite3 ships no prebuild for
        # Electron 43's ABI, so it compiles here and the runner's glibc becomes
        # the floor for every Linux artifact. 24.04 emitted GLIBC_2.38, which
        # excluded Debian 12 and RHEL 9; 22.04 puts the floor at 2.34.
        #
        # Going older means building in a container, and the cheap candidates
        # fail on the compiler: Electron 43 bundles Node 24, whose headers need
        # gcc 12.2+ (see the toolchain step). Debian bullseye tops out at
        # gcc-10, with no gcc-11 in its archive or backports.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine channel from tag
        id: channel
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "script=publish" >> "$GITHUB_OUTPUT"
            echo "app_env=beta" >> "$GITHUB_OUTPUT"
          else
            echo "script=publish:prod" >> "$GITHUB_OUTPUT"
            echo "app_env=stable" >> "$GITHUB_OUTPUT"
          fi

      # The runner's default gcc-11 cannot build better-sqlite3 against these
      # headers: V8 puts a C++11 attribute before a GNU one in a class head,
      # which gcc rejects until 12, and gcc-10 additionally lacks
      # <source_location>. Node 24 documents gcc 12.2 as its minimum.
      # LDFLAGS folds libstdc++ in so the age of the user's C++ runtime stops
      # mattering; glibc stays a separate floor (see the matrix pin).
      - name: Set up Linux toolchain and maker dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg gcc-12 g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"
          echo "LDFLAGS=-static-libstdc++ -static-libgcc" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      # The GitHub publisher names the release after package.json's version, not
      # the git tag. Sync them so the tag you push is the release you get.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Building version $VERSION"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish
        run: yarn ${{ steps.channel.outputs.script }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_ENV: ${{ steps.channel.outputs.app_env }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GCAST_APP_ID: ${{ secrets.GCAST_APP_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_API_SECRET: ${{ secrets.LIBREFM_API_SECRET }}

  # Rebuild the site so its download links pick up the new release assets.
  netlify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsSL -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"

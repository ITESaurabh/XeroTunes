<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <style>
      /* Shown only until React mounts and the MUI theme takes over. Static CSS can't
         read the saved theme, so it follows the OS to avoid a mismatched flash.
         Values are the Amethyst defaults in config/theme.ts. */
      body {
        background-color: #f4f1f9;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #201e23;
        }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XeroTunes</title>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
